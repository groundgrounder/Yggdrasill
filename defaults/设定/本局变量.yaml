# 世界树默认声明（spec/02）：复制进本卡的 设定/ 后修改，复制以后即为本卡的声明。
# 身份、职位、知识的用法见 spec/09；职位以势力为键，本卡须有势力库，没有时改写或删去职位。
词表:
  关系阶段: [陌生, 相识, 友好, 信任, 疏远]
  装备状态: [完好, 破损, 报废]   # 一层骨架的装备状态引用它，必须声明
角色:
  关系: {映射: {键: {引用: 角色组}, 值: {取值: 词表.关系阶段}}}
  好感度: {映射: {键: {引用: 角色组}, 值: {数值: [-100, 100]}}}
  身份: {集合: {形态: 文本}}
  职位: {映射: {键: {引用: 势力}, 值: {形态: 文本}}}
  知识: {集合: {形态: 文本}}
