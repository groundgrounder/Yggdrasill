技能:
  分法: 按种类
  分级: [门类]
  字段:
    来源: {必填: true, 取值: [习得, 天生]}
    门类: {必填: true, 取值: 能力.技艺}
    技能等级: {必填: true, 取值: 等级.技艺}
    效果: {必填: true, 形态: 文本}
    边界: {形态: 文本列表}
装备:
  分法: 按种类
  分级: [标签]
  字段:
    标签: {取值: [灯具, 工具, 航具]}
    装备等级: {取值: 等级.技艺}
    简介: {形态: 文本}
    效果: {形态: 文本列表}
地点:
  分法: 按上下级
  上级类型:
    海域: []
    港镇: [海域]
    街区: [港镇]
    地标: [港镇, 街区]
  字段:
    类型: {必填: true, 取值: [海域, 港镇, 街区, 地标]}
    概况: {必填: true, 形态: 文本}
    主管势力: {引用: 势力, 适用类型: [港镇]}
    相邻: {引用: 地点, 列表: true}
势力:
  分法: 按种类
  分级: [类型]
  字段:
    类型: {取值: [官署, 商会]}
    所在区域: {引用: 地点}
    组织特点: {形态: 文本列表}
船只:
  分法: 按种类
  分级: [类型]
  字段:
    类型: {取值: [渔船, 货船]}
    船级: {必填: true, 取值: 等级.船级}
    所属: {引用: 势力}
    简介: {形态: 文本}
    航线: {映射: {键: {引用: 地点}, 值: {形态: 文本}}}
